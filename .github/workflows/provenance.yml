name: provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  attest:
    name: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Generate source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output dist/aegispy-source.tar.gz HEAD

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/aegispy-source.tar.gz
