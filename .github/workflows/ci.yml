name: ci

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Check
        run: bash scripts/check

      - name: Attest Runtime Artifacts
        id: attest_runtime_artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/engine/cpython-wasi.wasm
            artifacts/engine/aegispy-capability-bridge.py
            artifacts/component/aegispy.component.wasm

      - name: Stage Provenance Bundle
        run: |
          mkdir -p artifacts/security
          bundle_path="${{ steps.attest_runtime_artifacts.outputs.bundle-path }}"
          if [ -z "$bundle_path" ] || [ ! -f "$bundle_path" ]; then
            echo "attestation bundle not found at: ${bundle_path}" >&2
            exit 1
          fi
          cp "$bundle_path" artifacts/security/provenance-bundle.jsonl

      - name: Verify Provenance Gate
        env:
          AEGISPY_PROVENANCE_VERIFY_REQUIRED: "1"
          AEGISPY_PROVENANCE_REPO: ${{ github.repository }}
          AEGISPY_PROVENANCE_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
          AEGISPY_PROVENANCE_BUNDLE_PATH: artifacts/security/provenance-bundle.jsonl
        run: bash scripts/provenance_verify_check

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
