name: ci

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-floor-check:
    name: linux-floor-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_floor='+p.node.floor+'\\n');fs.appendFileSync(process.env.GITHUB_OUTPUT,'rust_toolchain='+p.rust.toolchain+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_floor }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Portable Check
        run: pnpm run check:portable

      - name: Fail on tracked-file churn
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Tracked files changed during linux-floor-check:"
            git status --porcelain=v1
            exit 1
          fi

  host-contracts:
    name: host-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_pinned='+p.node.pinned+'\\n');fs.appendFileSync(process.env.GITHUB_OUTPUT,'rust_toolchain='+p.rust.toolchain+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_pinned }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.runtime-policy.outputs.rust_toolchain }}

      - name: Host Contract Tests
        run: pnpm run test:host-contracts

      - name: Fail on tracked-file churn
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Tracked files changed during host-contracts:"
            git status --porcelain=v1
            exit 1
          fi

      - name: Upload Host Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-contracts-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  linux-check:
    name: linux-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_pinned='+p.node.pinned+'\\n');fs.appendFileSync(process.env.GITHUB_OUTPUT,'rust_toolchain='+p.rust.toolchain+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_pinned }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.runtime-policy.outputs.rust_toolchain }}

      - name: Check
        run: pnpm run check

      - name: Attest Runtime Artifacts
        id: attest_runtime_artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/engine/cpython-wasi.wasm
            artifacts/engine/aegispy-capability-bridge.py
            artifacts/component/aegispy.component.wasm

      - name: Stage Provenance Bundle
        run: |
          mkdir -p artifacts/security
          bundle_path="${{ steps.attest_runtime_artifacts.outputs.bundle-path }}"
          if [ -z "$bundle_path" ] || [ ! -f "$bundle_path" ]; then
            echo "attestation bundle not found at: ${bundle_path}" >&2
            exit 1
          fi
          cp "$bundle_path" artifacts/security/provenance-bundle.jsonl

      - name: Verify Provenance Gate
        env:
          AEGISPY_PROVENANCE_VERIFY_REQUIRED: "1"
          AEGISPY_PROVENANCE_REPO: ${{ github.repository }}
          AEGISPY_PROVENANCE_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
          AEGISPY_PROVENANCE_BUNDLE_PATH: artifacts/security/provenance-bundle.jsonl
        run: bash scripts/provenance_verify_check

      - name: Fail on tracked-file churn
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Tracked files changed during linux-check:"
            git status --porcelain=v1
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  macos-smoke:
    name: macos-smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_pinned='+p.node.pinned+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_pinned }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Portable Check
        run: pnpm run check:portable

      - name: Portable Floor Prototype
        run: node scripts/portable_isolation_floor_smoke.mjs

      - name: Fail on tracked-file churn
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Tracked files changed during macos-smoke:"
            git status --porcelain=v1
            exit 1
          fi

      - name: Upload macOS Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_pinned='+p.node.pinned+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_pinned }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Portable Check
        shell: bash
        run: pnpm run check:portable

      - name: Portable Floor Prototype
        shell: bash
        run: node scripts/portable_isolation_floor_smoke.mjs

      - name: Fail on tracked-file churn
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Tracked files changed during windows-smoke:"
            git status --porcelain=v1
            exit 1
          fi

      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
