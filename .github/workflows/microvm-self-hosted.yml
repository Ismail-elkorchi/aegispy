name: microvm-self-hosted

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-microvm-smoke:
    name: node-microvm-smoke
    runs-on:
      - self-hosted
      - linux
      - x64
      - microvm
    timeout-minutes: 60
    env:
      AEGISPY_NODE_TRANSPORT: process
      AEGISPY_WORKER_EXECUTION_MODE: microvm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load Runtime Policy
        id: runtime-policy
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('tools/runtime-versions.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_pinned='+p.node.pinned+'\\n');fs.appendFileSync(process.env.GITHUB_OUTPUT,'rust_toolchain='+p.rust.toolchain+'\\n');"

      - name: Setup pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.runtime-policy.outputs.node_pinned }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.runtime-policy.outputs.rust_toolchain }}

      - name: Microvm Smoke
        run: pnpm vitest run packages/aegispy-node/test/runtime-hardening.test.ts -t "records configured microvm execution mode when a launcher is available"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
