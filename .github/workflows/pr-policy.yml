name: pr-policy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    name: enforce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: PR Policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/pr_policy_check

      - name: Banned Token Scan
        run: bash scripts/banned_token_scan

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-policy-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
