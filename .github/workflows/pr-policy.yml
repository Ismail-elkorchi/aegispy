name: pr-policy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    name: enforce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: PR Policy
        run: bash scripts/pr_policy_check

      - name: Banned Token Scan
        run: bash scripts/banned_token_scan

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-policy-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
