[package]
name = "aegispy_worker"
version = "0.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.50", features = ["io-util"] }
ureq = "3.2"
wasmtime = { version = "42.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "42.0.1", default-features = false, features = ["p2"] }
bytes = "1.11"
libc = "0.2"
